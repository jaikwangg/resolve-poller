<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor Tracking Report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
  :root{color-scheme:light;
    --bg:#f9f9f7;--surface:#fcfcfb;--surface-2:#f0efec;--text:#0b0b0b;--text-2:#52514e;--muted:#898781;
    --border:rgba(11,11,11,.10);--accent:#2a78d6;--good:#0ca30c;--warn:#fab219;--crit:#d03b3b;--idle:#c3c2b7;
    --font:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0d0d0d;--surface:#1a1a19;--surface-2:#242422;--text:#fff;--text-2:#c3c2b7;--muted:#898781;
    --border:rgba(255,255,255,.10);--accent:#3987e5;--idle:#4a4a47}}
  :root[data-theme="dark"]{color-scheme:dark;--bg:#0d0d0d;--surface:#1a1a19;--surface-2:#242422;--text:#fff;
    --text-2:#c3c2b7;--muted:#898781;--border:rgba(255,255,255,.10);--accent:#3987e5;--idle:#4a4a47}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.6}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
  h1{font-size:20px;margin:0}
  .ctl{display:flex;gap:8px;flex-wrap:wrap}
  input,select,button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
  button{cursor:pointer}
  .host{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
  .host h2{font-size:17px;margin:0 0 2px}
  .meta{color:var(--muted);font-size:12.5px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
  .tile{background:var(--surface-2);border-radius:10px;padding:10px 12px}
  .tile .l{font-size:12px;color:var(--muted)} .tile .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  h3{font-size:14px;margin:16px 0 6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:500}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--idle)}
  .dot.on{background:var(--good)}
  .jump{color:var(--crit);font-weight:600}
  ul.w{margin:0;padding-left:18px} ul.w li{margin:3px 0}
  .warnbox{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--border));border-radius:10px;padding:8px 12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .empty{color:var(--muted);padding:24px;text-align:center}
  @media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
  @media print{.ctl{display:none}body{background:#fff}.host{break-inside:avoid-page;border-color:#ccc}}
</style>
<div class="wrap">
  <div class="bar">
    <h1>รายงานการทำงานรายวัน</h1>
    <div class="ctl">
      <input type="date" id="day">
      <select id="host"><option value="">ทุกเครื่อง</option></select>
      <button onclick="window.print()">พิมพ์ / PDF</button>
    </div>
  </div>
  <div id="out" class="empty">กำลังโหลด…</div>
  <p class="meta">% และเวลาทำงานเป็นตัวชี้วัดคร่าว ๆ (advisory) — ไม่ใช้ประเมินบุคคลโดยตรง · เวลาทำงาน = มี input และ Resolve อยู่หน้าสุด</p>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const q = new URLSearchParams(location.search);
const today = new Date(Date.now() - new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
$("#day").value = q.get("day") || today;

function hostCard(h){
  const s = h.summary;
  const pct = v => v==null ? "–" : v+"%";
  return `<section class="host">
    <h2>${esc(h.host)}</h2>
    <div class="meta">stage ${esc(h.stage)} · record ${s.records} ตัว (${s.first}–${s.last})</div>
    <div class="tiles">
      <div class="tile"><div class="l">เวลาทำงาน</div><div class="n">${esc(s.active_text)}</div></div>
      <div class="tile"><div class="l">เริ่ม – เลิก (active)</div><div class="n">${s.first_active ? s.first_active+"–"+s.last_active : "–"}</div></div>
      <div class="tile"><div class="l">ข้อมูลขาดช่วง</div><div class="n">${s.gap_count} ครั้ง</div></div>
      <div class="tile"><div class="l">รวมเวลาที่ขาด</div><div class="n">${s.gap_min} นาที</div></div>
    </div>
    ${h.warnings.length ? `<h3>ข้อสังเกต</h3><div class="warnbox"><ul class="w">${h.warnings.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
    <div class="two">
      <div><h3>เวลาทำงานต่อ job</h3><table>${h.by_job.map(j=>`<tr><td>${esc(j.job)}</td><td class="num">${esc(j.text)}</td></tr>`).join("") || "<tr><td>–</td></tr>"}</table></div>
      <div><h3>เวลาทำงานต่อหน้า Resolve / stage</h3><table>${h.by_page.map(j=>`<tr><td>${esc(j.page)}</td><td class="num">${esc(j.text)}</td></tr>`).join("") || "<tr><td>–</td></tr>"}</table></div>
    </div>
    <h3>ความคืบหน้าที่เปลี่ยน</h3>
    <table><tr><th>เวลา</th><th>job</th><th>stage</th><th>%</th><th>รายละเอียด</th></tr>
      ${h.progress.map(p=>`<tr><td class="num">${p.at}</td><td>${esc(p.job)}</td><td>${esc(p.stage)}</td>
        <td class="num ${p.jump?"jump":""}">${pct(p.from)} → ${pct(p.to)}${p.jump?" ⚠":""}</td><td>${esc(p.detail||"")}</td></tr>`).join("") || "<tr><td colspan=5>–</td></tr>"}
    </table>
    <h3>ไทม์ไลน์</h3>
    <table><tr><th>ช่วงเวลา</th><th>record</th><th>กำลังทำ</th><th>แอปหน้าสุด</th></tr>
      ${h.segments.map(g=>`<tr><td class="num"><span class="dot ${g.active?"on":""}"></span>${g.start}${g.end!==g.start?"–"+g.end:""}</td>
        <td class="num">${g.n}</td><td>${esc(g.what)}</td><td>${esc(g.front)}</td></tr>`).join("")}
    </table>
    ${h.gaps.length ? `<h3>ช่วงที่ไม่มีข้อมูล</h3><table><tr><th>ช่วง</th><th>นาที</th><th>สาเหตุที่เป็นไปได้</th></tr>
      ${h.gaps.map(g=>`<tr><td class="num">${g.from}–${g.to}</td><td class="num">${g.minutes}</td><td>${esc(g.why)}</td></tr>`).join("")}</table>` : ""}
  </section>`;
}

async function load(){
  const p = new URLSearchParams({day: $("#day").value, host: $("#host").value});
  history.replaceState(null, "", "?"+p);
  const d = await (await fetch("api/report?"+p)).json();
  const cur = $("#host").value;
  $("#host").innerHTML = `<option value="">ทุกเครื่อง</option>` + d.hosts_available.map(h=>`<option ${h===cur?"selected":""}>${esc(h)}</option>`).join("");
  $("#out").className = d.hosts.length ? "" : "empty";
  $("#out").innerHTML = d.hosts.length ? d.hosts.map(hostCard).join("") : "ไม่มีข้อมูลของวันนี้";
}
$("#host").value = q.get("host") || "";
$("#day").onchange = load; $("#host").onchange = load;
load();
</script>
