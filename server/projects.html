<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Counts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
  :root{color-scheme:light;
    --bg:#f9f9f7;--surface:#fcfcfb;--surface-2:#f0efec;--text:#0b0b0b;--text-2:#52514e;--muted:#898781;
    --border:rgba(11,11,11,.10);--accent:#2a78d6;--good:#0ca30c;--warn:#fab219;--crit:#d03b3b;--idle:#c3c2b7;
    --font:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0d0d0d;--surface:#1a1a19;--surface-2:#242422;--text:#fff;--text-2:#c3c2b7;--muted:#898781;
    --border:rgba(255,255,255,.10);--accent:#3987e5;--idle:#4a4a47}}
  :root[data-theme="dark"]{color-scheme:dark;--bg:#0d0d0d;--surface:#1a1a19;--surface-2:#242422;--text:#fff;
    --text-2:#c3c2b7;--muted:#898781;--border:rgba(255,255,255,.10);--accent:#3987e5;--idle:#4a4a47}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.6}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
  h1{font-size:20px;margin:0}
  .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  select,button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
  button{cursor:pointer}
  a{color:var(--accent)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
  .card h2{font-size:18px;margin:0 0 2px}
  .meta{color:var(--muted);font-size:12.5px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
  .tile{background:var(--surface-2);border-radius:10px;padding:10px 12px}
  .tile .l{font-size:12px;color:var(--muted)} .tile .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .tile .s{font-size:12px;color:var(--text-2)}
  .meter{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin:4px 0 2px}
  .meter i{display:block;height:100%;background:var(--accent);border-radius:5px}
  h3{font-size:14px;margin:16px 0 6px}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:500}
  td.t{white-space:nowrap;font-variant-numeric:tabular-nums}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .flag{font-weight:600} .flag.up{color:var(--crit)} .flag.down{color:var(--crit)} .flag.tl{color:var(--text-2)}
  ul.w{margin:0;padding-left:18px} ul.w li{margin:3px 0}
  .warnbox{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--border));border-radius:10px;padding:8px 12px;margin-top:8px}
  .empty{color:var(--muted);padding:24px;text-align:center}
  .nocount{color:var(--muted)}
  @media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
  @media print{.ctl{display:none}body{background:#fff}.card{break-inside:avoid-page;border-color:#ccc}}
</style>
<div class="wrap">
  <div class="bar">
    <div>
      <h1>ตัวเลขนับรายโปรเจค</h1>
      <div class="meta" id="gen"></div>
    </div>
    <div class="ctl">
      <select id="days">
        <option value="1">วันนี้</option>
        <option value="7">7 วัน</option>
        <option value="30" selected>30 วัน</option>
        <option value="3650">ทั้งหมด</option>
      </select>
      <button onclick="window.print()">พิมพ์ / PDF</button>
      <a href="./">dashboard</a> · <a href="report">รายงานรายวัน</a>
    </div>
  </div>
  <div id="sum"></div>
  <div id="out" class="empty">กำลังโหลด…</div>
  <p class="meta">ตัวเลขมาจาก timeline ที่เปิดอยู่ใน DaVinci Resolve ตอนที่ agent อ่าน (ทุก 1 นาที) · "เกรดแล้ว" นับคลิปที่มีการแก้สี
    ซึ่งยังเป็นค่าประมาณ · ใช้ดูความคืบหน้าของงาน ไม่ใช้ประเมินบุคคล</p>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = v => v == null ? "–" : Number(v).toLocaleString("th-TH");
const pctOf = (a, b) => (a == null || !b) ? null : Math.round(a * 1000 / b) / 10;
const dur = s => { if (s == null) return "–"; s = Math.round(s); const m = Math.floor(s/60);
  return m >= 60 ? `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}:${String(s%60).padStart(2,"0")}` : `${m}:${String(s%60).padStart(2,"0")}`; };
const mins = m => m < 60 ? `${m} นาที` : `${Math.floor(m/60)} ชม.${m%60 ? ` ${m%60} นาที` : ""}`;
const q = new URLSearchParams(location.search);
if (q.get("days")) $("#days").value = q.get("days");

function card(p){
  const c = p.counts;
  const gp = c ? pctOf(c.graded_clips, c.video_clips) : null;
  const tiles = c ? `<div class="tiles">
      <div class="tile"><div class="l">คลิปใน timeline</div><div class="n">${n(c.video_clips)}</div><div class="s">${esc(c.timeline)} · ยาว ${dur(c.duration_sec)}</div></div>
      <div class="tile"><div class="l">เกรดแล้ว</div><div class="n">${n(c.graded_clips)}</div>
        <div class="meter" role="img" aria-label="เกรดแล้ว ${gp ?? 0}%"><i style="width:${gp ?? 0}%"></i></div><div class="s">${gp == null ? "–" : gp + "%"}</div></div>
      <div class="tile"><div class="l">ยังไม่เกรด</div><div class="n">${c.graded_clips == null ? "–" : n(c.video_clips - c.graded_clips)}</div></div>
      <div class="tile"><div class="l">shot (จาก marker)</div><div class="n">${n(p.shots.total || c.shots)}</div>
        <div class="s">${p.shots.total ? `conform ${n(p.shots.conformed)} · เกรด ${n(p.shots.graded)}` : "ยังไม่มี marker ชื่อ shot"}</div></div>
    </div>` : `<p class="nocount">ไม่มีตัวเลขนับ</p>`;
  const rooms = p.rooms.length ? `<h3>ตามห้อง (ค่าล่าสุดของแต่ละห้อง)</h3><div class="scroll"><table>
      <tr><th>ห้อง</th><th>stage</th><th>timeline</th><th class="num">คลิป</th><th class="num">เกรดแล้ว</th><th class="num">shot</th><th>อ่านล่าสุด</th></tr>
      ${p.rooms.map(r => `<tr><td>${esc(r.host)}</td><td>${esc(r.stage)}</td><td>${esc(r.timeline)}</td>
        <td class="num">${n(r.video_clips)}</td><td class="num">${n(r.graded_clips)}</td><td class="num">${n(r.shots)}</td><td class="t">${esc(r.at)}</td></tr>`).join("")}
    </table></div>` : "";
  const hist = p.history.length ? `<h3>ครั้งที่ตัวเลขเปลี่ยน (ล่าสุดก่อน)</h3><div class="scroll"><table>
      <tr><th>เวลา</th><th>ห้อง</th><th>timeline</th><th class="num">คลิป</th><th class="num">เกรดแล้ว</th><th class="num">เปลี่ยน</th><th></th></tr>
      ${p.history.map(h => `<tr><td class="t">${esc(h.at)}</td><td>${esc(h.host)}</td><td>${esc(h.timeline)}</td>
        <td class="num">${n(h.video_clips)}</td><td class="num">${n(h.graded_clips)}</td>
        <td class="num">${h.delta_graded == null ? "เริ่ม" : (h.delta_graded > 0 ? "+" : "") + h.delta_graded}</td>
        <td>${h.jump ? `<span class="flag up">เพิ่มเร็วผิดปกติ</span>` : h.drop ? `<span class="flag down">ลดลง</span>` : ""}${h.timeline_changed ? ` <span class="flag tl">เปลี่ยน timeline</span>` : ""}</td></tr>`).join("")}
    </table></div>` : "";
  return `<section class="card">
    <h2>${esc(p.title)}</h2>
    <div class="meta">${p.resolve_projects.length ? "โปรเจค Resolve: " + p.resolve_projects.map(esc).join(", ") + " · " : ""}ห้อง ${p.hosts.map(esc).join(", ") || "–"}
      · ${esc(p.first_at)} – ${esc(p.last_at)} · ทำงาน ${mins(p.active_min)} · ข้อมูล ${n(p.records)} ครั้ง${p.source === "erp" ? " · ผูกกับ booking ใน PMS" : ""}</div>
    ${tiles}
    ${p.notes.length ? `<div class="warnbox"><ul class="w">${p.notes.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${rooms}${hist}
  </section>`;
}

function summary(ps){
  const counted = ps.filter(p => p.counts);
  const sum = k => counted.reduce((a, p) => a + (p.counts[k] || 0), 0);
  const clips = sum("video_clips"), graded = sum("graded_clips");
  const gradable = counted.filter(p => p.counts.graded_clips != null).reduce((a, p) => a + (p.counts.video_clips || 0), 0);
  return `<div class="tiles">
    <div class="tile"><div class="l">โปรเจค</div><div class="n">${n(ps.length)}</div><div class="s">มีตัวเลขนับ ${n(counted.length)}</div></div>
    <div class="tile"><div class="l">คลิปรวม</div><div class="n">${n(clips)}</div></div>
    <div class="tile"><div class="l">เกรดแล้วรวม</div><div class="n">${n(graded)}</div><div class="s">${gradable ? pctOf(graded, gradable) + "%" : "–"}</div></div>
    <div class="tile"><div class="l">ห้องที่ส่งข้อมูล</div><div class="n">${n(new Set(ps.flatMap(p => p.hosts)).size)}</div></div>
  </div>`;
}

async function load(){
  const p = new URLSearchParams({days: $("#days").value});
  history.replaceState(null, "", "?" + p);
  try {
    const d = await (await fetch("api/projects?" + p)).json();
    $("#gen").textContent = "อัปเดต " + new Date(d.generated_at).toLocaleString("th-TH") + " · รีเฟรชเองทุก 1 นาที";
    $("#sum").innerHTML = d.projects.length ? summary(d.projects) : "";
    $("#out").className = d.projects.length ? "" : "empty";
    $("#out").innerHTML = d.projects.length ? d.projects.map(card).join("") : "ยังไม่มีข้อมูลในช่วงนี้";
  } catch (e) {
    $("#gen").textContent = "โหลดข้อมูลไม่ได้: " + e;
  }
}
$("#days").onchange = load;
load();
setInterval(load, 60000);
</script>
